<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting… · Mapleton 44th Ward</title>
  <!-- Serves for any path GitHub Pages can't find here, so deep links forward too.
       Preserve the sub-path/query/hash and swap only the host to the new home. -->
  <script>
    (function () {
      var dest = "https://m44ward.github.io" + window.location.pathname +
                 window.location.search + window.location.hash;
      window.location.replace(dest);
    })();
  </script>
  <!-- No-JS fallback: send to the hub. -->
  <meta http-equiv="refresh" content="0; url=https://m44ward.github.io/m44links/" />
  <link rel="canonical" href="https://m44ward.github.io/m44links/" />
  <style>
    body {
      font-family: 'Georgia', serif;
      background: #f4f7fc;
      color: #2c3a4a;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      margin: 0;
    }
    .box { max-width: 22rem; line-height: 1.5; }
    h1 { font-size: 1.15rem; color: #1d3557; margin: 0 0 0.6rem; }
    a { color: #1d3557; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Mapleton 44th Ward Links has moved</h1>
    <p>If you are not redirected automatically,
    <a href="https://m44ward.github.io/m44links/">tap here to continue</a>.</p>
  </div>
</body>
</html>
